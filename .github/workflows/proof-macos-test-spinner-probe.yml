# Temporary proof workflow: does an orphaned Task.yield spinner and/or a perform-block
# NSApp.run() stall Swift Task.sleep progress under CPU saturation? Never merged.
name: Proof macOS test spinner probe

on:
  push:
    branches: [proof/macos-test-spinner-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select Xcode and build probe
        run: |
          set -euo pipefail
          source scripts/lib/swift-toolchain.sh
          select_xcode_toolchain
          sw_vers
          sysctl -n hw.logicalcpu
          xcrun swiftc -Onone -swift-version 6 .github/proof-spinner/probe.swift -o "$RUNNER_TEMP/probe"

      - name: Probe matrix under CPU saturation
        run: |
          set +e
          cpu="$(sysctl -n hw.logicalcpu)"
          probe="$RUNNER_TEMP/probe"
          echo "== unloaded control"
          "$probe" 1 1 30 | tail -2
          load=()
          for _ in $(seq 1 "$cpu"); do sudo -n nice -n -20 yes > /dev/null & load+=("$!"); done
          for _ in $(seq 1 $(( cpu * 3 ))); do yes > /dev/null & load+=("$!"); done
          sleep 5
          for round in 1 2; do
            for spinners in 0 1 3; do
              for nsapp in 0 1; do
                echo "== round=$round spinners=$spinners nsapp=$nsapp"
                timeout 150 "$probe" "$spinners" "$nsapp" 120
                echo "exit=$?"
              done
            done
          done
          sudo -n pkill -x yes
          kill "${load[@]}" 2>/dev/null
          wait 2>/dev/null
          exit 0
